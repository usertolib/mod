name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: SMPTweaks-fabric
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
